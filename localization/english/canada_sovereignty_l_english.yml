l_english:
 canada_sovereignty.1.t: "The Question of Sovereignty"
 canada_sovereignty.1.d: "From the Maritimes to Rupert's Land and the Columbia District, British North America now answers to a single government. Some in Parliament argue that a united Canada has outgrown its place under Westminster and should chart its own course. Others warn that without British protection, the Dominion stands alone beside an ambitious republic to the south. For now, London has signalled that it is willing to talk."
 canada_sovereignty.1.f: "Peace, order, and good government. The only question is whose."
 canada_sovereignty.1.a: "We will revisit this in time."
 canada_sovereignty.1.b: "Open negotiations with London."
 canada_sovereignty.1.c: "Canada will take its independence."

 canada_sovereignty.2.t: "Terms of the Accord"
 canada_sovereignty.2.d: "Our delegation has arrived in London. The Colonial Office is prepared to grant Canada full sovereignty in exchange for a lasting partnership. Some of our delegates believe we can press for more, and that Newfoundland's future lies with Canada rather than as a lonely outpost of the Empire."
 canada_sovereignty.2.f: "A nation is not only declared. It is negotiated, line by line."
 canada_sovereignty.2.a: "A clean and friendly parting."
 canada_sovereignty.2.b: "Newfoundland joins Confederation."
 canada_sovereignty.2.c: "We are not ready to sign."

 canada_sovereignty.3.t: "The Confederation Conference"
 canada_sovereignty.3.d: "Delegates from Upper and Lower Canada, New Brunswick and Nova Scotia, with envoys of the Hudson's Bay Company and the Columbia District, have agreed to meet and discuss a union of British North America. London will not stand in the way. Where the conference sits matters: the host city is likely to become the capital of whatever emerges. The delegates may also go home with nothing agreed, and the colonies will carry on as they are."
 canada_sovereignty.3.f: "Every colony arrived with its own grievances. The question is whether they leave with a country."
 canada_sovereignty.3.a: "Meet in Ottawa, on the border of the two Canadas."
 canada_sovereignty.3.b: "Meet in Quebec City, the oldest capital on the continent."
 canada_sovereignty.3.c: "Meet in Halifax, gateway to the Atlantic."
 canada_sovereignty.3.e: "The delegates go home without an agreement."

 canada_sovereignty.4.t: "London Tightens Its Grip"
 canada_sovereignty.4.d: "A new Governor General has arrived with instructions from the Colonial Office: tariffs will be set in London, and appointments to the Legislative Council will be reviewed there too. Our ministers are furious, but open defiance would sour relations with the Crown."
 canada_sovereignty.4.f: "The Empire gives with one hand and takes with the other."
 canada_sovereignty.4.a: "We will abide by the instructions."
 canada_sovereignty.4.b: "Canadians will not be governed from Downing Street."

 canada_sovereignty.5.t: "The Reformers Rally"
 canada_sovereignty.5.d: "Crowds have gathered in the squares of our cities to hear reformers call for a government answerable to Canadians alone. Newspapers from Halifax to the Red River are printing their speeches. London is watching closely to see how we respond."
 canada_sovereignty.5.f: "A people that reads its own newspapers soon wants its own government."
 canada_sovereignty.5.a: "Let them be heard."
 canada_sovereignty.5.b: "Disperse the crowds and keep the peace."

 canada_sovereignty.6.t: "A Nation Won by Arms"
 canada_sovereignty.6.d: "The guns have fallen silent and London has recognized what our soldiers won in the field: Canada is sovereign. The victory belongs to every farmer, voyageur and militiaman who stood against the greatest empire on earth. Now we must decide how to carry it."
 canada_sovereignty.6.f: "We stand on guard, and we stood."
 canada_sovereignty.6.a: "Let the world remember how Canada was won."
 canada_sovereignty.6.b: "Offer London an honourable peace between equals."

 canada_sovereignty.7.t: "The Rising Fails"
 canada_sovereignty.7.d: "Our bid for independence has failed. British authority is restored, the leaders of the rising are in hiding or in chains, and many Canadians wonder whether the cause was ever worth the cost. It will be years before we can try again."
 canada_sovereignty.7.f: "A cause can be defeated. It is harder to make it forgotten."
 canada_sovereignty.7.a: "We will bide our time."

 je_canadian_sovereignty: "Path to Sovereignty"
 je_canadian_sovereignty_reason: "Canada remains a dominion of the United Kingdom. How and when we stand on our own is a choice we can make when the time is right.\n\n#b National Identity#! rises a little every month, and faster with [concept_literacy] of 30% or more, voting rights, a top 20 [concept_gdp] or [concept_sol], and Major Power status. Standing up to London and letting reformers be heard raise it too.\n\nIt falls when we bow to London's demands, break up reform rallies, or lose a war of independence.\n\nAt #v 50#!, London will consider letting Newfoundland join Confederation."

 canada_national_identity_bar: "National Identity"
 canada_national_identity_bar_desc: "National Identity: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/100"
 canada_identity_generation_tt: "A generation growing up Canadian"
 canada_identity_literacy_tt: "[concept_literacy] of at least 30%"
 canada_identity_franchise_tt: "Canadians vote for their own government"
 canada_identity_gdp_tt: "[concept_gdp] in the top 20"
 canada_identity_sol_tt: "[concept_sol] in the top 20"
 canada_identity_rank_tt: "Canada is a Major Power or greater"
 canada_identity_newfoundland_tt: "Requires #v National Identity#! of at least #v 50#!"

 canada_negotiate_accord_button: "Negotiate the Anglo-Canadian Accord"
 canada_negotiate_accord_button_desc: "Send a delegation to London to secure a peaceful independence. Canada stays in Britain's sphere, with a ten-year alliance, mutual trade privileges, and a truce between the two nations."
 canada_break_hard_button: "Declare Independence"
 canada_break_hard_button_desc: "Break with London by force. Britain will not take this lightly."

 canada_anglo_canadian_accord: "Anglo-Canadian Accord"
 canada_anglo_canadian_accord_desc: "Canada and the United Kingdom parted as equals and remain close partners."

 canada_independence_by_arms: "Independence by Arms"
 canada_independence_by_arms_desc: "Canada won its sovereignty on the battlefield, and the world has taken notice."
 canada_rebellion_crushed: "Rebellion Crushed"
 canada_rebellion_crushed_desc: "Canada's rising against Britain failed. Another attempt must wait."

 rule_canada_start: "Canadian Start"
 setting_canada_start_confederation: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_canada_start_confederation_desc Confederation Conference#!#!"
 setting_canada_start_confederation_desc: "On the first day of the game, Upper Canada calls a conference to unite British North America. Accept and Canada faces the question of sovereignty at once."
 setting_canada_start_vanilla: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_canada_start_vanilla_desc Base Game#!#!"
 setting_canada_start_vanilla_desc: "British North America starts divided, as in the base game. The Path to Sovereignty opens once Canada forms."
